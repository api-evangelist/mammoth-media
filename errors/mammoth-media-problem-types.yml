method: searched
source: https://docs.tokenbot.com/home/api-docs/errors
format: custom-flat-json
envelope:
  fields: [statusCode, code, message, details]
  note: >-
    REST errors are a flat JSON object (NOT RFC 9457 problem+json). `details` is
    optional and present only for some errors (validation, rate limiting).
  example: '{"statusCode":401,"code":"UNAUTHENTICATED","message":"...","details":{}}'
graphql_errors:
  note: GraphQL uses the standard `errors` array plus a success/error envelope inside data.
  fields: [message, path, errorType]
