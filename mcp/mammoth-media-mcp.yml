server:
  name: tokenbot
  binary: tokenbot-mcp
  transport: stdio
  description: >-
    The TokenBot MCP server lets AI assistants interact with the TokenBot
    platform — exchanges, strategies, copiers, trades, and user context — as
    MCP tools, plus read-only resources and guided prompts.
auth:
  backend: TokenBot GraphQL
  env:
