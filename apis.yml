description: >-
  Mammoth Media is a Greylock-backed consumer technology company whose current
  product is TokenBot (mammoth.la now redirects to tokenbot.com) — a social,
  copy-trading platform for cryptocurrency communities on Discord and Telegram
  that synchronizes algorithmic trades across 12+ exchanges in real time. For
  developers TokenBot exposes a documented REST API (api.tokenbot.com/v1), a
  GraphQL API, HMAC-signed webhooks with 46 event types, a stdio Model Context
  Protocol (MCP) server exposing 25 tools, and a first-party `tokenbot` CLI
  distributed via npm and Homebrew. Authentication is API-key (tb_live_/tb_test_)
  or a secp256k1 signed-request fast-path; the CLI-first design keeps exchange
  keys under user control (trade-only permissions, no withdrawal access).
